---
# Measure __GMT_VAR_PAGE__ in a headless Chromium driven by Playwright, with a
# warm caching proxy in front of it.
#
# This is GMT's templates/website/usage_scenario_cached.yml - the webnrg
# benchmark - with four deliberate changes, all of them made so that this
# scenario and parrot/usage_scenario.yml measure the same thing:
#
#   1. Chromium instead of Firefox.
#   2. The measured idle is 30 s rather than 5 s.
#   3. The scroll phase is a fixed 5 s of wheel ticks rather than a loop that
#      runs until the bottom of the page, so that both scenarios scroll for the
#      same amount of time on every site.
#   4. Both measured phases end on a fixed deadline shared with the Parrot
#      scenario (common/phase-clock.sh), so they last equally long in both.
#
# The sibling scenario in this repository drives a real Google Chrome through
# real X input instead of through Playwright. See the repository README for
# what is and is not comparable between the two.
#
# HEADLESS, AND WHAT THAT MEANS. With --headless true, GMT's launcher starts
# Playwright's chrome-headless-shell, a separate build without browser UI, and
# not Chromium itself: 153.0.8010.12 for Playwright 1.63.0. On top of the
# switch list parrot/common/launch-browser.sh copies, it passes --headless,
# --hide-scrollbars, --mute-audio and a --blink-settings that makes pages see a
# mouse (hover and a fine pointer). Its user agent says HeadlessChrome/153,
# which bot managers look for. Measured from /proc/<pid>/cmdline and from a page
# in the playwright:v1.63.0-noble image, 2026-09-24. Full Chromium in headless
# mode would need GMT's launcher to pass channel 'chromium', which it does not.
#
# Headless and not headful in an Xvfb, as before 2026-09-24: this is the
# variant chosen for the sweep. playwright/usage_scenario_headful.yml is the
# headful one, on the host's display.
#
# RUN IT WITH (the page, and where the review screenshot goes; off skips it):
#
#    runner.py \
#     --uri /home/didi/code/1000-websites \
#     --filename playwright/usage_scenario.yml \
#     --variable __GMT_VAR_PAGE__=https://www.green-coding.io \
#     --variable __GMT_VAR_SCREENSHOT_URL__=off \
#     --dev-no-sleeps --dev-no-system-checks=check_ssh_session
#
name: "__GMT_VAR_PAGE__ - 1000 Websites Playwright Chrome"
author: Didi Hoffmann <didi@green-coding.io>
description: "Opens __GMT_VAR_PAGE__ in a headless Chromium from a warm proxy cache, idles 30 s, then scrolls for 5 s"

custom_metrics:
  website_load:
    unit: Website Load and Idle Cached
    sci: True

compose-file: !include-gmt-helper gmt-playwright-with-cache.yml

flow-prepend:
  - name: Starting browser IPC
    container: gmt-playwright-nodejs
    hidden: true
    commands:
      - type: console
        command: node /tmp/gmt-utils/gmt-playwright-ipc.js --headless true --browser chromium --proxy http://squid:3128
        note: Starting headless Chromium in background process with IPC
        detach: true
      - type: console
        command: timeout 60 bash -c 'until [ -p "/tmp/playwright-ipc-ready" ]; do sleep 1; done && echo "Browser ready!"'
        shell: bash
        note: Waiting for the browser to signal readiness on the rendezvous FIFO

flow:
  - name: Warmup and Caching
    container: gmt-playwright-nodejs
    hidden: true
    commands:
      - type: playwright
        command: await gmtPlaywrightCache("__GMT_VAR_PAGE__", 20);

  # 1432x809 was MEASURED, not chosen: it is exactly what
  # window.innerWidth/innerHeight report in the Parrot scenario's Chrome, whose
  # window fluxbox pins to 1440x900 with no decorations. 900 minus 91 px of tab
  # strip and toolbar, and 1440 minus the 8 px a real Chrome reserves for its
  # vertical scrollbar.
  #
  # Those 8 px are why this is not 1440: this Chromium's scrollbars take no
  # layout width (headless runs with --hide-scrollbars; the headful one got
  # overlay scrollbars from the emulated viewport), so asking for 1440 would
  # hand the page 8 CSS px more than Parrot does. Headless, the page reports
  # 1432x809 at devicePixelRatio 1, as it did headful.
  #
  # A step of its own because gmtPlaywrightCache() replaces the context and
  # therefore the page, and the new page comes back at the 1280x800 hard-coded
  # in gmt-playwright-ipc.js.
  - name: Match the Parrot viewport
    container: gmt-playwright-nodejs
    hidden: true
    commands:
      - type: playwright
        command: 'await page.setViewportSize({ width: 1432, height: 809 });'

  # Both measured phases open with phase-clock.sh start and close with
  # phase-clock.sh finish, which idles to a fixed deadline shared with
  # parrot/usage_scenario.yml: 33 s for the visit, 7 s for the scroll. The
  # energy of two phases is only comparable if they last equally long;
  # common/phase-clock.sh has the measurements that showed they did not.
  #
  # The deadline IS the idle, which is why there is no `sleep 30` any more.
  # page.goto blocks until the load event, so a fixed sleep after it made this
  # phase load time + 30 s, while in Parrot the page loads inside the idle.
  # spiegel.de took 31.68 s here against Parrot's 31.39 s, and web.de 30.84 s.
  - name: Visit page and idle for 30 s
    container: gmt-playwright-nodejs
    commands:
      - type: console
        command: bash /tmp/repo/common/phase-clock.sh start visit
      - type: playwright
        command: page_result = await page.goto("__GMT_VAR_PAGE__");
      - type: console
        command: echo $(date +%s%N) website_load=1
        shell: bash
      - type: console
        command: bash /tmp/repo/common/phase-clock.sh finish visit

  # Not part of the benchmark: see the same hidden phase in
  # parrot/usage_scenario.yml. page.screenshot takes the viewport; a headless
  # Chromium has no toolbar to show. It runs before the status check so that a
  # page failing that check still leaves a screenshot of what it served.
  #
  # The try/catch is load-bearing: a Playwright command that throws never
  # returns to GMT, and the run would sit in this hidden phase until the flow
  # times out. A missing screenshot is reported by the upload script instead.
  - name: Screenshot for review
    container: gmt-playwright-nodejs
    hidden: true
    commands:
      - type: playwright
        command: 'try { await page.screenshot({ path: "/tmp/review-screenshot.png", timeout: 15000 }); fs.writeFileSync("/tmp/review-screenshot.png.title", await page.title()); } catch (e) { console.log(`[screenshot] WARNING: ${e}`); }'
      - type: console
        command: bash /tmp/repo/common/upload-screenshot.sh /tmp/review-screenshot.png playwright headless __GMT_VAR_PAGE__ __GMT_VAR_SCREENSHOT_URL__

  - name: Check HTTP Status Code
    container: gmt-playwright-nodejs
    hidden: true
    commands:
      - type: playwright
        command: if (!page_result.ok()) throw `Page was not accessible. HTTP Return code ${page_result.status()}`

  # 25 ticks 200 ms apart is 5 s, the same 25 ticks at the same spacing that
  # parrot/chrome/scroll.parrot performs with X button 5. 120 px per tick is
  # measured too: one X wheel-down tick moves Chrome exactly 120 px, so both
  # scenarios travel 3000 px. The GMT template's 200 would travel 5000.
  #
  # No "stop at the bottom" check, unlike the template: ending early on a short
  # page would make the phase a different length on every site.
  #
  # The pointer is moved to the middle of the viewport first because that is
  # where the Parrot macro puts it, and a wheel event goes to what is under it.
  #
  # Tick i is due i x 200 ms after the loop started, not 200 ms after the
  # previous tick returned. mouse.wheel waits for the renderer to take the event,
  # so on a busy page the old relative spacing stretched: spiegel.de scrolled for
  # 7.21 s against Parrot's 6.19 s. A late tick now shortens the next wait.
  - name: Scroll down and wait 5 s
    container: gmt-playwright-nodejs
    commands:
      - type: console
        command: bash /tmp/repo/common/phase-clock.sh start scroll
      - type: playwright
        command: await page.mouse.move(720, 400);
      - type: playwright
        command: const t0 = Date.now(); for (let i = 1; i <= 25; i++) { await page.mouse.wheel(0, 120); await page.waitForTimeout(Math.max(0, t0 + i * 200 - Date.now())); }
      - type: console
        command: bash /tmp/repo/common/phase-clock.sh finish scroll
