        command: "PARROT_URL=https://www.collegeboard.org/ PARROT_CLICKS=1101,667 PARROT_CLICK_AT=6 bash /tmp/repo/parrot/common/batch-site.sh prepare 871 accept"
        shell: bash
        read-notes-stdout: true
        ignore-errors: true
  - name: "0871 www.collegeboard.org accept start"
