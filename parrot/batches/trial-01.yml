---
# GENERATED by tools/batch.py from sites_tranco_top1000.txt, batch 1 of 1:
# list positions 1 to 50. Do not edit, regenerate.
#
# Measures each site in a real Firefox 155 with Consent-O-Matic, driven by
# Parrot, from a warm squid cache. The README section "Batch runs" says how.
name: "1000 Websites Parrot Firefox - trial 01/01"
author: Didi Hoffmann <didi@green-coding.io>
description: "50 sites, each: warmup, load and idle 30 s, scroll 5 s, in Firefox with Consent-O-Matic"

custom_metrics:
  website_load:
    unit: Website Load and Idle Cached
    sci: True

services:
  squid:
    image: greencoding/squid_reverse_proxy:v5
    healthcheck:
      test: ["CMD", "curl", "-fs", "--proxy", "http://squid:3128", "https://www.google.com", "--insecure"]
      interval: "1h"
      start_period: "60s"
      start_interval: "1s"

  window-container:
    image: ribalba/parrot-browsers:v1
    depends_on:
      - squid
    environment:
      # Each site passes its own PARROT_URL on the command line. This one
      # only satisfies the scripts that insist on the variable being set.
      PARROT_URL: about:blank
      SCREENSHOT_URL: __GMT_VAR_SCREENSHOT_URL__
      PARROT_VARIANT: firefox-com
      SCREEN_SIZE: 1440x900x24
      RESOLUTION: 1440x900
      WINDOW_X: 0
      WINDOW_Y: 0
      WINDOW_WIDTH: 1440
      WINDOW_HEIGHT: 900
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    docker-run-args:
      - --shm-size=1g
    setup-commands:
      - command: bash /tmp/repo/parrot/common/firefox-policies.sh
      # Firefox 155 maps its window as WM_CLASS ("Navigator", "firefox").
      - command: bash /tmp/repo/parrot/common/pin-windows.sh Navigator 1440 900
      - command: bash /usr/local/bin/entrypoint.sh

flow:
  # Once per run. Without the template no site can run, so this one is
  # allowed to fail the run.
  - name: Build the Firefox template profile
    container: window-container
    hidden: true
    commands:
      - type: console
        command: bash /tmp/repo/parrot/common/make-template-profile.sh

  # 1: https://www.google.com/
  - name: "0001 www.google.com prepare"
    container: window-container
    hidden: true
    commands:
      - type: console
        command: "PARROT_URL=https://www.google.com/ bash /tmp/repo/parrot/common/batch-site.sh prepare 1"
        shell: bash
        read-notes-stdout: true
        ignore-errors: true
  - name: "0001 www.google.com start"
    container: window-container
    hidden: true
    commands:
      - type: console
        command: "PARROT_URL=https://www.google.com/ bash /tmp/repo/parrot/common/batch-site.sh start 1"
        shell: bash
        read-notes-stdout: true
        ignore-errors: true
  - name: "0001 www.google.com visit"
    container: window-container
    commands:
      - type: console
        command: "PARROT_URL=https://www.google.com/ bash /tmp/repo/parrot/common/batch-site.sh visit 1"
        shell: bash
        read-notes-stdout: true
        ignore-errors: true
  - name: "0001 www.google.com shot"
    container: window-container
    hidden: true
    commands:
      - type: console
        command: "PARROT_URL=https://www.google.com/ bash /tmp/repo/parrot/common/batch-site.sh shot 1"
        shell: bash
        read-notes-stdout: true
        ignore-errors: true
  - name: "0001 www.google.com scroll"
    container: window-container
