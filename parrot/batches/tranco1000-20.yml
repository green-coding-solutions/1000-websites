    container: window-container
    hidden: true
    commands:
      - type: console
        command: "PARROT_URL=https://www.tjk.org/ PARROT_CLICKS=1038,760 PARROT_CLICK_AT=6 bash /tmp/repo/parrot/common/batch-site.sh prepare 688 accept"
        shell: bash
        read-notes-stdout: true
        ignore-errors: true
  - name: "0688 www.tjk.org accept start"
