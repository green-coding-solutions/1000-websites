---
# GENERATED by tools/batch.py from sites.txt, batch 1 of 1:
# list positions 1 to 3, 3 sites, 3 visits. Do not edit, regenerate.
#
# Measures each site in a real Firefox 155 without consent add-on, driven by
# Parrot, from a warm squid cache. Sites with a cookie banner are visited up
# to three times: banner left alone, accepted and rejected, with real clicks.
# The README section "Batch runs" says how.
name: "1000 Websites Parrot Firefox - smoke 01/01"
author: Didi Hoffmann <didi@green-coding.io>
description: "3 sites in 3 visits, each: warmup, load and idle 30 s, scroll 5 s, in Firefox, cookie banners left, accepted or rejected"

custom_metrics:
  website_load:
    unit: Website Load and Idle Cached
    sci: True

services:
  squid:
    image: greencoding/squid_reverse_proxy:v5
    healthcheck:
      test: ["CMD", "curl", "-fs", "--proxy", "http://squid:3128", "https://www.google.com", "--insecure"]
      interval: "1h"
      start_period: "60s"
      start_interval: "1s"

  window-container:
    image: ribalba/parrot-browsers:v1
    depends_on:
      - squid
    environment:
      # Each visit passes its own PARROT_URL on the command line. This one
      # only satisfies the scripts that insist on the variable being set.
      PARROT_URL: about:blank
      SCREENSHOT_URL: __GMT_VAR_SCREENSHOT_URL__
      SCREEN_SIZE: 1440x900x24
      RESOLUTION: 1440x900
      WINDOW_X: 0
      WINDOW_Y: 0
      WINDOW_WIDTH: 1440
      WINDOW_HEIGHT: 900
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    docker-run-args:
      - --shm-size=1g
    setup-commands:
      - command: bash /tmp/repo/parrot/common/firefox-policies.sh
      # Firefox 155 maps its window as WM_CLASS ("Navigator", "firefox").
      # The consent clicks rely on this pin: banner-scan/find-clicks.py
      # found the coordinates in the same 1440x900 window at 0,0.
      - command: bash /tmp/repo/parrot/common/pin-windows.sh Navigator 1440 900
      - command: bash /usr/local/bin/entrypoint.sh

flow:

  # 1: https://www.tagesschau.de, visits: none
  - name: "0001 www.tagesschau.de none prepare"
    container: window-container
    hidden: true
    commands:
      - type: console
        command: "PARROT_URL=https://www.tagesschau.de bash /tmp/repo/parrot/common/batch-site.sh prepare 1 none"
        shell: bash
        read-notes-stdout: true
        ignore-errors: true
  - name: "0001 www.tagesschau.de none start"
    container: window-container
    hidden: true
    commands:
      - type: console
        command: "PARROT_URL=https://www.tagesschau.de bash /tmp/repo/parrot/common/batch-site.sh start 1 none"
        shell: bash
        read-notes-stdout: true
        ignore-errors: true
  - name: "0001 www.tagesschau.de none visit"
    container: window-container
    commands:
      - type: console
        command: "PARROT_URL=https://www.tagesschau.de bash /tmp/repo/parrot/common/batch-site.sh visit 1 none"
        shell: bash
        read-notes-stdout: true
        ignore-errors: true
  - name: "0001 www.tagesschau.de none shot"
    container: window-container
    hidden: true
    commands:
      - type: console
        command: "PARROT_URL=https://www.tagesschau.de bash /tmp/repo/parrot/common/batch-site.sh shot 1 none"
