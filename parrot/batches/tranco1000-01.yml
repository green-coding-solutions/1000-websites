    container: window-container
    hidden: true
    commands:
      - type: console
        command: "PARROT_URL=https://www.google.com/ PARROT_CLICKS=837,853 PARROT_CLICK_AT=6 bash /tmp/repo/parrot/common/batch-site.sh prepare 1 accept"
        shell: bash
        read-notes-stdout: true
        ignore-errors: true
  - name: "0001 www.google.com accept start"
